    <div>
      <p>动态引入</p>
      <button id="btn">load</button>
    </div>
    <script type="module">
      document.getElementById('btn').addEventListener('click',()=>{
        import('./src/main.js').then(res=>{
          console.log('动态加载成功',res)
          res.fun1();
          res.fun2();
        })
      })
    </script>
  </body>
